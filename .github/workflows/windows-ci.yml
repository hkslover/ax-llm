name: Windows CI

on:
  push:
    branches: [feat/native-tool-call]
  pull_request:
    branches: [feat/native-tool-call]
  workflow_dispatch:

jobs:
  build-axcl-windows-mingw64:
    name: AXCL Windows (mingw64) build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            curl
            unzip

      - name: Build (AXCL Windows mingw64)
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          build_dir=build_mingw64
          mkdir -p "${build_dir}"
          cd "${build_dir}"

          axcl_url="https://github.com/ZHEQIUSHUI/assets/releases/download/ax_3.6.2/axcl_win_x64_3.12.0.zip"
          axcl_zip="axcl_win_x64_3.12.0.zip"
          axcl_root="axcl_win_x64_3.12.0"

          curl -L -o "${axcl_zip}" "${axcl_url}"
          unzip -q "${axcl_zip}" -d "${axcl_root}"

          cmake -S .. -B . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_AX650=OFF \
            -DBUILD_AXCL=ON \
            -DAXCL_DIR="${PWD}/${axcl_root}"
          cmake --build . -j 2

      - name: Tokenizer smoke (Windows mingw64)
        shell: msys2 {0}
        run: |
          ./build_mingw64/tokenizer_smoke.exe

      - name: Install
        shell: msys2 {0}
        run: |
          cmake --install build_mingw64 --prefix build_mingw64/install

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axcl-windows-mingw64-artifacts
          path: |
            build_mingw64/install/**
            build_mingw64/main_axcl*
